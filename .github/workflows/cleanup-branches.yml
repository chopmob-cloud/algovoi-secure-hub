name: Delete stale branches

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete stale branches
        run: |
          for branch in fix/security-audit-findings claude/inspiring-hopper-js26hz claude/secure-hub-edge-guard-audit claude/secure-hub-final-hardening; do
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${branch}" && echo "Deleted $branch" || echo "$branch not found or already deleted"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
